config_version = 13

[bar.default]
capsule = true
capsule_border = "surface_variant"
capsule_fill = "surface"
capsule_padding = 4.0
capsule_radius = 4
capsule_thickness = 0.75
center = [ "active_window" ]
contact_shadow = true
end = [
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "cputemp",
    "gputemp",
    "sysmon",
    "clock",
    "control-center",
    "session"
]
font_family = "Iosevka Term SS05"
font_weight = 400
margin_edge = 0
margin_ends = 0
padding = 16
radius = 0
shadow = false
thickness = 32
widget_spacing = 4

[shell]
corner_radius_scale = 0.0
font_family = "Fira Sans"
settings_show_advanced = true

    [shell.panel]
    shadow = false

    [shell.screenshot]
    directory = "/home/sam/Pictures/Screenshots"

[theme]
source = "builtin"
builtin = "Nord"
mode = "dark"

[wallpaper]
directory = "/home/sam/Pictures"

[notification]
background_opacity = 0.95

[osd]
background_opacity = 0.95

    [osd.kinds]
    volume = false

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 300.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 330.0

[system.monitor]
gpu_poll_seconds = 2

[weather]
enabled = false

[widget.active_window]
max_length = 600
min_length = 0

[widget.cputemp]
stat = "cpu_temp"
type = "sysmon"

[widget.gputemp]
glyph = "car-turbine"
stat = "gpu_temp"
type = "sysmon"

[widget.media]
album_art_only = true

[widget.sysmon]
stat = "ram_pct"
